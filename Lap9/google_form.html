<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>google-form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
     <style>
    body {
        background: linear-gradient(180deg, #197c20 0%, #27c761 40%, #0eb47d 65%, #1f575c 100%);
        min-height: 100vh;
    }
    h1,h3{
        text-align: center;
    }
    p,hr{
        text-align: center;
        color: white;
    }
    </style>
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 700px;">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-1">แบบสอบถามเกี่ยวกับเกม</h1>
                <h3 class="h6 text-muted mb-4">เรื่อง พฤติกรรมและการเล่นเกม</h3>
                
                <form action="confirmmed.html" method="get">
                    <h5 class="mt-4 mb-3">ส่วนที่ 1 ข้อมูลทั่วไป</h5>
                    <div class="mb-3">
                        <label for="name" class="form-label">ชื่อ</label>
                        <input type="text" class="form-control" name="name" id="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="studentid" class="form-label">นามสกุล</label>
                        <input type="text" class="form-control" name="studentid" id="studentid" required>
                    </div>

                    <div class="mb-3">
                        <label for="year" class="form-label">เพศ</label>
                        <select name="year" id="year" class="form-select">
                            <option value="ปี1">ชาย</option>
                            <option value="ปี2">หญิง</option>
                            <option value="ปี3">ไม่ต้องการตอบ</option>
                            <option value="ปี4">ไม่ระบุ</option>
                        </select>
                    </div>
                    <h5 class="mt-4 mb-3">ส่วนที่ 2 อุปกรณ์หลักในการเล่นเกม</h5>

                    <label class="form-label">อุปกรณ์ที่ใช้เล่นเกม (เลือกได้มากกว่า 1 ข้อ)</label>

                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="device1" value="Notebook" id="device1">
                        <label class="form-check-label" for="device1">Notebook</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="device2" value="Tablet" id="device2">
                        <label class="form-check-label" for="device2">iPad / Tablet</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="device3" value="Computer" id="device3">
                        <label class="form-check-label" for="device3">Computer</label>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="device4" value="Smartphone" id="device4">
                        <label class="form-check-label" for="device4">Smartphone</label>
                    </div>
                    <label class="form-label">ประเภทที่ชอบเล่นมากที่สุด</label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="os" value="MOBA" id="osMOBA">
                        <label class="form-check-label" for="osMOBA">MOBA</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="os" value="FPS" id="osFPS">
                        <label class="form-check-label" for="osFPS">FPS</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="os" value="RPG" id="osRPG">
                        <label class="form-check-label" for="osRPG">RPG</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="os" value="Action" id="osAction">
                        <label class="form-check-label" for="osAction">Action</label>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="radio" name="os" value="Sports" id="osSports">
                        <label class="form-check-label" for="osSports">Sports</label>
                    </div>

                    <h5 class="mt-4 mb-3">ส่วนที่ 3 พฤติกรรมการเล่นเกม</h5>
                    <label class="form-label">โดยเฉลี่ยใช้เวลาเล่นเกมวันละกี่ชั่วโมง</label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="internet" value="less2" id="int1">
                        <label class="form-check-label" for="int1">น้อยกว่า 2 ชั่วโมง</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="internet" value="2-4" id="int2">
                        <label class="form-check-label" for="int2">2–4 ชั่วโมง</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="internet" value="5-7" id="int3">
                        <label class="form-check-label" for="int3">5–7 ชั่วโมง</label>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="radio" name="internet" value="more7" id="int4">
                        <label class="form-check-label" for="int4">มากกว่า 7 ชั่วโมง</label>
                    </div>

                    <label class="form-label">เหตุผลหลักที่คุณเล่นเกม</label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="purpose" value="study" id="p1">
                        <label class="form-check-label" for="p1">เพื่อคคลายเครียด / ผักผ่อน</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="purpose" value="game" id="p2">
                        <label class="form-check-label" for="p2">เพื่อความสนุกสนานและเข้าสังคม</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="purpose" value="movie" id="p3">
                        <label class="form-check-label" for="p3">ชอบความท้าทายและการแข่งขัน</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="purpose" value="social" id="p4">
                        <label class="form-check-label" for="p4">เสพเนื้อเรื่องและงานภาพ / เสียงของเกม</label>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="radio" name="purpose" value="search" id="p5">
                        <label class="form-check-label" for="p5">เพื่อฆ่าเวลา</label>
                    </div>

                    <h5 class="mt-4 mb-3">ส่วนที่ 4 ความคิดเห็น</h5>
                    <div class="mb-3">
                        <label for="website" class="form-label">แอปที่ใช่ในการเล่นบ่อยที่สุด</label>
                        <select name="website" id="website" class="form-select">
                            <option value="Steam">Steam</option>
                            <option value="Epic game">Epic game</option>
                            <option value="xbox">Xbox</option>
                            <option value="อื่นๆ">อื่นๆ</option>
                        </select>
                    </div>

                    <label class="form-label">คุณคิดว่าการเล่นความสำคัญมากแค่ไหน</label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="importance" value="5" id="imp5">
                        <label class="form-check-label" for="imp5">มากที่สุด</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="importance" value="4" id="imp4">
                        <label class="form-check-label" for="imp4">มาก</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="importance" value="3" id="imp3">
                        <label class="form-check-label" for="imp3">ปานกลาง</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="importance" value="2" id="imp2">
                        <label class="form-check-label" for="imp2">น้อย</label>
                    </div>
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="radio" name="importance" value="1" id="imp1">
                        <label class="form-check-label" for="imp1">น้อยที่สุด</label>
                    </div>

                    <div class="d-flex gap-2">
                        <input type="submit" value="ส่งแบบสอบถาม" class="btn btn-primary">
                        <input type="reset" value="ล้างข้อมูล" class="btn btn-outline-secondary">
                    </div>
                </form>
            </div>
        </div>
    </div>
<footer>
    <hr>
    <p>&copy; สงวนลิขสิทธิ์ 2569 โดย 056950405231-1 นายจตุรภัทร เสือศรี CPE69/2-RMUTP</p>
  </footer>
</body>
</html>
